spring.application.name=employee-scheduler
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_scheduler
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD

# Apply the documented SQL migrations explicitly; never auto-migrate legacy shifts.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Backend only. No key means interpretation returns 503; manual scheduling remains available.
app.llm.api-key=${GROQ_API_KEY:}
app.llm.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.llm.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.llm.connect-timeout-seconds=${GROQ_CONNECT_TIMEOUT_SECONDS:5}
app.llm.timeout-seconds=${GROQ_TIMEOUT_SECONDS:30}
