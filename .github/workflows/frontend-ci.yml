name: Frontend CI

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run all frontend tests, including API contract checks
        run: npm test

      - name: Build for production
        run: npm run build
